services:
  web:
    build:
      context: .
    image: gym-ghost:latest
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    environment:
      RAILS_ENV: production
      RAILS_LOG_LEVEL: "${RAILS_LOG_LEVEL:-info}"
      APP_HOSTS: "${APP_HOSTS:?Set APP_HOSTS in .env}"
      SECRET_KEY_BASE: "${SECRET_KEY_BASE:?Set SECRET_KEY_BASE in .env}"
      ATTR_ENCRYPTED_KEY: "${ATTR_ENCRYPTED_KEY:?Set ATTR_ENCRYPTED_KEY in .env}"
      SMOKE_USER_EMAIL: "${SMOKE_USER_EMAIL:-}"
      SMOKE_USER_PASSWORD: "${SMOKE_USER_PASSWORD:-}"
      PARTNER_BRANCHES_API_BASE_URL: "${PARTNER_BRANCHES_API_BASE_URL:?Set PARTNER_BRANCHES_API_BASE_URL in .env}"
      PARTNER_BRANCHES_BRAND: "${PARTNER_BRANCHES_BRAND:?Set PARTNER_BRANCHES_BRAND in .env}"
      PARTNER_AUTH_TOKEN: "${PARTNER_AUTH_TOKEN:?Set PARTNER_AUTH_TOKEN in .env}"
      PARTNER_AUTH_ORIGIN: "${PARTNER_AUTH_ORIGIN:?Set PARTNER_AUTH_ORIGIN in .env}"
      PARTNER_AUTH_REFERER: "${PARTNER_AUTH_REFERER:?Set PARTNER_AUTH_REFERER in .env}"
      INITIAL_ADMIN_EMAIL: "${INITIAL_ADMIN_EMAIL:-}"
      INITIAL_ADMIN_PASSWORD: "${INITIAL_ADMIN_PASSWORD:-}"
    volumes:
      - gym_ghost_storage:/app/storage
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "ruby",
          "-rnet/http",
          "-ruri",
          "-e",
          "response = Net::HTTP.get_response(URI('http://127.0.0.1:3000/up')); exit(response.is_a?(Net::HTTPSuccess) ? 0 : 1)"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  gym_ghost_storage:
